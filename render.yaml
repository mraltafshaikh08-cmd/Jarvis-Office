services:
  - type: web
    name: jarvis-office
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: ALTAF_PHONE_NUMBER
        value: "+919359086445"
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        value: jarvis_secret_token_2026