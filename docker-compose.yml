version: '3.8'

services:
  jarvis-office:
    build: .
    container_name: jarvis-office
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3-flash-preview
      - ALTAF_PHONE_NUMBER=+919359086445
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=jarvis_secret_token_2026
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
